<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Counter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f8fafc;
      flex: 1;
    }

    .back-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      display: none;
    }
    .back-btn:hover { background: #334155; color: #f8fafc; }

    main { padding: 1.5rem; max-width: 680px; margin: 0 auto; }

    .view { display: none; }
    .view.active { display: block; }

    .sessions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .sessions-header h2 { font-size: 1.1rem; color: #94a3b8; font-weight: 500; }

    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #2563eb; }
    .btn.secondary { background: #334155; color: #e2e8f0; }
    .btn.secondary:hover { background: #475569; }
    .btn.danger { background: #ef4444; }
    .btn.danger:hover { background: #dc2626; }
    .btn.sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card:hover { border-color: #3b82f6; background: #243044; }
    .card-info h3 { font-size: 1rem; font-weight: 600; color: #f1f5f9; margin-bottom: 0.2rem; }
    .card-info p { font-size: 0.8rem; color: #64748b; }
    .card-actions { display: flex; gap: 0.5rem; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #475569;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .empty-state p { font-size: 0.9rem; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      display: none;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 1.5rem;
      width: 90%;
      max-width: 420px;
    }
    .modal h3 { font-size: 1rem; font-weight: 700; margin-bottom: 1.25rem; color: #f8fafc; }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.4rem; font-weight: 500; }
    .field input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.6rem 0.875rem;
      color: #f1f5f9;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: #3b82f6; }
    .field input::placeholder { color: #475569; }

    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; }

    .session-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .session-title { font-size: 1.4rem; font-weight: 700; color: #f8fafc; margin-bottom: 0.25rem; }
    .session-meta { font-size: 0.8rem; color: #64748b; }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.875rem;
    }
    .section-header h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; font-weight: 600; }

    .scoreboard {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .scoreboard table { width: 100%; border-collapse: collapse; }
    .scoreboard th, .scoreboard td {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.875rem;
      border-bottom: 1px solid #0f172a;
    }
    .scoreboard thead th {
      background: #0f172a;
      color: #64748b;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .scoreboard tbody tr:last-child td { border-bottom: none; }
    .scoreboard tbody tr:hover td { background: #243044; }
    .scoreboard .player-name { color: #f1f5f9; font-weight: 600; }
    .scoreboard .score { color: #3b82f6; font-weight: 700; text-align: right; }
    .scoreboard .remove-player { text-align: right; }
    .rank-1 .player-name::before { content: "🥇 "; }
    .rank-2 .player-name::before { content: "🥈 "; }
    .rank-3 .player-name::before { content: "🥉 "; }

    .round-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .round-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      cursor: pointer;
      user-select: none;
    }
    .round-header:hover { background: #243044; }
    .round-header .round-label { font-size: 0.875rem; font-weight: 600; color: #94a3b8; }
    .round-header .round-scores-preview { font-size: 0.75rem; color: #64748b; flex: 1; margin: 0 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .round-header .chevron { color: #475569; transition: transform 0.2s; font-size: 0.75rem; flex-shrink: 0; }
    .round-card.expanded .chevron { transform: rotate(180deg); }
    .round-body { display: none; border-top: 1px solid #334155; }
    .round-card.expanded .round-body { display: block; }
    .round-scores { padding: 0.75rem 1rem; }
    .round-score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.375rem 0;
      font-size: 0.875rem;
    }
    .round-score-row .rp-name { color: #94a3b8; }
    .round-score-row .rp-score { color: #e2e8f0; font-weight: 600; min-width: 2.5rem; text-align: right; }
    .round-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 0.5rem 1rem 0.75rem;
    }

    .score-grid { display: flex; flex-direction: column; gap: 0.625rem; max-height: 50vh; overflow-y: auto; }
    .score-row { display: flex; align-items: center; gap: 0.75rem; }
    .score-row .p-name { flex: 1; font-size: 0.875rem; color: #e2e8f0; font-weight: 500; }
    .score-row input {
      width: 90px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: #f1f5f9;
      font-size: 0.9rem;
      text-align: right;
      outline: none;
    }
    .score-row input:focus { border-color: #3b82f6; }

    .alert {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 8px;
      padding: 0.6rem 0.875rem;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
    }
    .alert.show { display: block; }

    /* Read-only view */
    .ro-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0c2340;
      border: 1px solid #1d4ed8;
      color: #93c5fd;
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      gap: 1rem;
    }
    .ro-banner span { opacity: 0.7; }
    .ro-banner a { color: #60a5fa; text-decoration: none; font-weight: 600; flex-shrink: 0; }
    .ro-banner a:hover { text-decoration: underline; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #16a34a;
      color: #fff;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: transform 0.22s ease;
      z-index: 300;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      main { padding: 1rem; }
      .scoreboard th, .scoreboard td { padding: 0.6rem 0.75rem; }
    }
  </style>
</head>
<body>

<header>
  <button class="back-btn" id="backBtn" onclick="showSessions()">&#8592;</button>
  <h1 id="headerTitle">Score Counter</h1>
</header>

<main>
  <!-- Sessions View -->
  <div class="view active" id="sessionsView">
    <div class="sessions-header">
      <h2>Sessions</h2>
      <button class="btn" onclick="openNewSessionModal()">+ New Session</button>
    </div>
    <div id="sessionsList"></div>
  </div>

  <!-- Session Detail View -->
  <div class="view" id="sessionView">
    <div class="session-header-row">
      <div>
        <div class="session-title" id="sessionName"></div>
        <div class="session-meta" id="sessionMeta"></div>
      </div>
      <button class="btn sm secondary" id="shareBtn" onclick="shareSession()">&#128279; Share</button>
    </div>

    <div class="section-header">
      <h3>Scoreboard</h3>
      <button class="btn sm secondary" onclick="openAddPlayerModal()">+ Player</button>
    </div>
    <div class="scoreboard">
      <table>
        <thead><tr><th>Player</th><th style="text-align:right">Total</th><th></th></tr></thead>
        <tbody id="scoreboardBody"></tbody>
      </table>
    </div>

    <div class="section-header">
      <h3>Rounds</h3>
      <button class="btn sm" onclick="openAddRoundModal()">+ Round</button>
    </div>
    <div id="roundsList"></div>
    <div class="empty-state" id="roundsEmpty" style="display:none">
      <div class="icon">🎯</div>
      <p>No rounds yet. Add the first round!</p>
    </div>
  </div>

  <!-- Read-only View -->
  <div class="view" id="roView">
    <div class="ro-banner">
      <span>&#128274; Read-only snapshot</span>
      <a id="roAppLink" href="">Open App</a>
    </div>
    <div class="session-title" id="roTitle"></div>
    <div class="session-meta" id="roMeta"></div>

    <div class="section-header" style="margin-top:1.75rem">
      <h3>Scoreboard</h3>
    </div>
    <div class="scoreboard">
      <table>
        <thead><tr><th>Player</th><th style="text-align:right">Total</th></tr></thead>
        <tbody id="roScoreboardBody"></tbody>
      </table>
    </div>

    <div class="section-header">
      <h3>Rounds</h3>
    </div>
    <div id="roRoundsList"></div>
  </div>
</main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- New Session Modal -->
<div class="modal-overlay" id="newSessionModal">
  <div class="modal">
    <h3>New Session</h3>
    <div class="alert" id="newSessionAlert"></div>
    <div class="field">
      <label>Session Name</label>
      <input type="text" id="newSessionName" placeholder="e.g. Game Night #1" maxlength="60">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('newSessionModal')">Cancel</button>
      <button class="btn" onclick="createSession()">Create</button>
    </div>
  </div>
</div>

<!-- Add Player Modal -->
<div class="modal-overlay" id="addPlayerModal">
  <div class="modal">
    <h3>Add Player</h3>
    <div class="alert" id="addPlayerAlert"></div>
    <div class="field">
      <label>Player Name</label>
      <input type="text" id="newPlayerName" placeholder="Unique name" maxlength="40">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('addPlayerModal')">Cancel</button>
      <button class="btn" onclick="addPlayer()">Add</button>
    </div>
  </div>
</div>

<!-- Add / Edit Round Modal -->
<div class="modal-overlay" id="addRoundModal">
  <div class="modal">
    <h3 id="addRoundTitle">Add Round</h3>
    <div class="alert" id="addRoundAlert"></div>
    <div class="score-grid" id="scoreGrid"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('addRoundModal')">Cancel</button>
      <button class="btn" id="saveRoundBtn" onclick="saveRound()">Save Round</button>
    </div>
  </div>
</div>

<!-- Delete Session Modal -->
<div class="modal-overlay" id="deleteSessionModal">
  <div class="modal">
    <h3>Delete Session?</h3>
    <p style="color:#94a3b8;font-size:0.875rem;margin-bottom:1.25rem">This will permanently delete the session and all its rounds.</p>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('deleteSessionModal')">Cancel</button>
      <button class="btn danger" onclick="confirmDeleteSession()">Delete</button>
    </div>
  </div>
</div>

<script>
  // ── Storage ───────────────────────────────────────────────────────────────
  const STORE_KEY = 'scoreCounterData';

  function loadData() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { sessions: [] }; }
    catch { return { sessions: [] }; }
  }

  function saveData(data) {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ── State ─────────────────────────────────────────────────────────────────
  let data = loadData();
  let currentSessionId = null;
  let editingRoundId = null;
  let pendingDeleteSessionId = null;

  // ── Navigation ────────────────────────────────────────────────────────────
  function showSessions() {
    document.getElementById('sessionsView').classList.add('active');
    document.getElementById('sessionView').classList.remove('active');
    document.getElementById('roView').classList.remove('active');
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('headerTitle').textContent = 'Score Counter';
    currentSessionId = null;
    renderSessions();
  }

  function showSession(id) {
    currentSessionId = id;
    document.getElementById('sessionsView').classList.remove('active');
    document.getElementById('sessionView').classList.add('active');
    document.getElementById('roView').classList.remove('active');
    document.getElementById('backBtn').style.display = 'block';
    renderSession();
  }

  // ── Sessions ──────────────────────────────────────────────────────────────
  function renderSessions() {
    const el = document.getElementById('sessionsList');
    if (!data.sessions.length) {
      el.innerHTML = `<div class="empty-state"><div class="icon">🎲</div><p>No sessions yet. Create one to get started!</p></div>`;
      return;
    }
    el.innerHTML = data.sessions.slice().reverse().map(s => {
      const rounds = s.rounds.length;
      const players = s.players.length;
      return `
        <div class="card" onclick="showSession('${s.id}')">
          <div class="card-info">
            <h3>${esc(s.name)}</h3>
            <p>${players} player${players !== 1 ? 's' : ''} &middot; ${rounds} round${rounds !== 1 ? 's' : ''}</p>
          </div>
          <div class="card-actions" onclick="event.stopPropagation()">
            <button class="btn sm danger" onclick="promptDeleteSession('${s.id}')">Delete</button>
          </div>
        </div>`;
    }).join('');
  }

  function openNewSessionModal() {
    document.getElementById('newSessionName').value = '';
    hideAlert('newSessionAlert');
    openModal('newSessionModal');
    setTimeout(() => document.getElementById('newSessionName').focus(), 50);
  }

  function createSession() {
    const name = document.getElementById('newSessionName').value.trim();
    if (!name) { showAlert('newSessionAlert', 'Please enter a session name.'); return; }
    const session = { id: uid(), name, players: [], rounds: [], createdAt: Date.now() };
    data.sessions.push(session);
    saveData(data);
    closeModal('newSessionModal');
    showSession(session.id);
  }

  function promptDeleteSession(id) {
    pendingDeleteSessionId = id;
    openModal('deleteSessionModal');
  }

  function confirmDeleteSession() {
    data.sessions = data.sessions.filter(s => s.id !== pendingDeleteSessionId);
    saveData(data);
    pendingDeleteSessionId = null;
    closeModal('deleteSessionModal');
    if (currentSessionId) showSessions();
    else renderSessions();
  }

  // ── Session detail ────────────────────────────────────────────────────────
  function getSession() {
    return data.sessions.find(s => s.id === currentSessionId);
  }

  function renderSession() {
    const s = getSession();
    if (!s) { showSessions(); return; }
    document.getElementById('headerTitle').textContent = s.name;
    document.getElementById('sessionName').textContent = s.name;
    document.getElementById('sessionMeta').textContent =
      `${s.players.length} player${s.players.length !== 1 ? 's' : ''} · ${s.rounds.length} round${s.rounds.length !== 1 ? 's' : ''}`;
    renderScoreboard(s);
    renderRounds(s);
  }

  function calcTotals(s) {
    const t = {};
    s.players.forEach(p => t[p] = 0);
    s.rounds.forEach(r => s.players.forEach(p => t[p] = (t[p] || 0) + (r.scores[p] || 0)));
    return t;
  }

  function renderScoreboard(s) {
    const t = calcTotals(s);
    const sorted = [...s.players].sort((a, b) => t[b] - t[a]);
    const body = document.getElementById('scoreboardBody');
    if (!s.players.length) {
      body.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#475569;padding:1.5rem">No players yet. Add a player to start.</td></tr>`;
      return;
    }
    body.innerHTML = sorted.map((p, i) => `
      <tr class="${i < 3 ? `rank-${i + 1}` : ''}">
        <td class="player-name">${esc(p)}</td>
        <td class="score">${t[p]}</td>
        <td class="remove-player">
          <button class="btn sm danger" onclick="removePlayer('${esc(p)}')">✕</button>
        </td>
      </tr>`).join('');
  }

  function renderRounds(s) {
    const list = document.getElementById('roundsList');
    const empty = document.getElementById('roundsEmpty');
    if (!s.rounds.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    list.innerHTML = s.rounds.map((r, i) => roundCardHTML(r, i, s.players, true)).join('');
  }

  function roundCardHTML(r, i, players, editable) {
    const preview = players.map(p => `${p}: ${r.scores[p] ?? 0}`).join(' · ');
    const id = `rc-${r.id ?? i}`;
    return `
      <div class="round-card" id="${id}">
        <div class="round-header" onclick="document.getElementById('${id}').classList.toggle('expanded')">
          <span class="round-label">Round ${i + 1}</span>
          <span class="round-scores-preview">${esc(preview)}</span>
          <span class="chevron">▼</span>
        </div>
        <div class="round-body">
          <div class="round-scores">
            ${players.map(p => `
              <div class="round-score-row">
                <span class="rp-name">${esc(p)}</span>
                <span class="rp-score">${r.scores[p] ?? 0}</span>
              </div>`).join('')}
          </div>
          ${editable ? `<div class="round-footer">
            <button class="btn sm secondary" onclick="openEditRoundModal('${r.id}')">Edit</button>
            <button class="btn sm danger" onclick="deleteRound('${r.id}')">Delete</button>
          </div>` : ''}
        </div>
      </div>`;
  }

  // ── Players ───────────────────────────────────────────────────────────────
  function openAddPlayerModal() {
    document.getElementById('newPlayerName').value = '';
    hideAlert('addPlayerAlert');
    openModal('addPlayerModal');
    setTimeout(() => document.getElementById('newPlayerName').focus(), 50);
  }

  function addPlayer() {
    const s = getSession();
    const name = document.getElementById('newPlayerName').value.trim();
    if (!name) { showAlert('addPlayerAlert', 'Please enter a player name.'); return; }
    if (s.players.includes(name)) { showAlert('addPlayerAlert', 'A player with that name already exists.'); return; }
    s.players.push(name);
    saveData(data);
    closeModal('addPlayerModal');
    renderSession();
  }

  function removePlayer(name) {
    const s = getSession();
    if (!confirm(`Remove "${name}" from this session? Their scores will be lost.`)) return;
    s.players = s.players.filter(p => p !== name);
    s.rounds.forEach(r => delete r.scores[name]);
    saveData(data);
    renderSession();
  }

  // ── Rounds ────────────────────────────────────────────────────────────────
  function buildScoreGrid(existingScores = {}) {
    const s = getSession();
    if (!s.players.length) return '<p style="color:#64748b;font-size:0.875rem">Add players first.</p>';
    return s.players.map(p => `
      <div class="score-row">
        <span class="p-name">${esc(p)}</span>
        <input type="number" id="score-${esc(p)}" value="${existingScores[p] ?? 0}" placeholder="0">
      </div>`).join('');
  }

  function openAddRoundModal() {
    const s = getSession();
    if (!s.players.length) { alert('Add at least one player before adding rounds.'); return; }
    editingRoundId = null;
    document.getElementById('addRoundTitle').textContent = 'Add Round';
    document.getElementById('saveRoundBtn').textContent = 'Save Round';
    document.getElementById('scoreGrid').innerHTML = buildScoreGrid();
    hideAlert('addRoundAlert');
    openModal('addRoundModal');
  }

  function openEditRoundModal(roundId) {
    const s = getSession();
    const round = s.rounds.find(r => r.id === roundId);
    if (!round) return;
    editingRoundId = roundId;
    document.getElementById('addRoundTitle').textContent = 'Edit Round';
    document.getElementById('saveRoundBtn').textContent = 'Update Round';
    document.getElementById('scoreGrid').innerHTML = buildScoreGrid(round.scores);
    hideAlert('addRoundAlert');
    openModal('addRoundModal');
  }

  function saveRound() {
    const s = getSession();
    const scores = {};
    for (const p of s.players) {
      const n = parseInt(document.getElementById(`score-${p}`)?.value ?? '0', 10);
      if (isNaN(n)) { showAlert('addRoundAlert', `Score for "${p}" must be an integer.`); return; }
      scores[p] = n;
    }
    if (editingRoundId) {
      const round = s.rounds.find(r => r.id === editingRoundId);
      if (round) round.scores = scores;
    } else {
      s.rounds.push({ id: uid(), scores });
    }
    saveData(data);
    closeModal('addRoundModal');
    renderSession();
  }

  function deleteRound(roundId) {
    if (!confirm('Delete this round?')) return;
    const s = getSession();
    s.rounds = s.rounds.filter(r => r.id !== roundId);
    saveData(data);
    renderSession();
  }

  // ── Sharing ───────────────────────────────────────────────────────────────
  async function compress(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    const cs = new CompressionStream('deflate-raw');
    const w = cs.writable.getWriter();
    w.write(bytes);
    w.close();
    const buf = await new Response(cs.readable).arrayBuffer();
    const arr = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  }

  async function decompress(b64) {
    const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const ds = new DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter();
    w.write(bytes);
    w.close();
    const buf = await new Response(ds.readable).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }

  async function shareSession() {
    const s = getSession();
    const btn = document.getElementById('shareBtn');
    btn.textContent = '…';
    btn.disabled = true;
    try {
      // compact format: {n, p, r} where r is array of score arrays (indexed by player order)
      const compact = { n: s.name, p: s.players, r: s.rounds.map(r => s.players.map(p => r.scores[p] ?? 0)) };
      const encoded = await compress(compact);
      const url = location.origin + location.pathname + '?v=' + encoded;
      try {
        await navigator.clipboard.writeText(url);
        showToast('Link copied!');
      } catch {
        prompt('Copy this link:', url);
      }
    } finally {
      btn.textContent = '🔗 Share';
      btn.disabled = false;
    }
  }

  // ── Read-only view ────────────────────────────────────────────────────────
  async function tryReadOnly() {
    const param = new URLSearchParams(location.search).get('v');
    if (!param) return false;
    try {
      const compact = await decompress(param);
      const s = {
        name: compact.n,
        players: compact.p,
        rounds: compact.r.map(arr => ({ scores: Object.fromEntries(compact.p.map((p, i) => [p, arr[i]])) }))
      };
      renderReadOnly(s);
      return true;
    } catch {
      return false;
    }
  }

  function renderReadOnly(s) {
    document.getElementById('sessionsView').classList.remove('active');
    document.getElementById('sessionView').classList.remove('active');
    document.getElementById('roView').classList.add('active');
    document.getElementById('headerTitle').textContent = s.name;
    document.getElementById('roAppLink').href = location.origin + location.pathname;
    document.getElementById('roTitle').textContent = s.name;
    document.getElementById('roMeta').textContent =
      `${s.players.length} player${s.players.length !== 1 ? 's' : ''} · ${s.rounds.length} round${s.rounds.length !== 1 ? 's' : ''}`;

    const t = {};
    s.players.forEach(p => t[p] = 0);
    s.rounds.forEach(r => s.players.forEach(p => t[p] = (t[p] || 0) + (r.scores[p] || 0)));
    const sorted = [...s.players].sort((a, b) => t[b] - t[a]);

    document.getElementById('roScoreboardBody').innerHTML = sorted.map((p, i) => `
      <tr class="${i < 3 ? `rank-${i + 1}` : ''}">
        <td class="player-name">${esc(p)}</td>
        <td class="score">${t[p]}</td>
      </tr>`).join('');

    const list = document.getElementById('roRoundsList');
    if (!s.rounds.length) {
      list.innerHTML = '<div class="empty-state"><div class="icon">🎯</div><p>No rounds yet.</p></div>';
      return;
    }
    list.innerHTML = s.rounds.map((r, i) => roundCardHTML(r, i, s.players, false)).join('');
  }

  // ── Modal helpers ─────────────────────────────────────────────────────────
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function showAlert(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.classList.add('show'); }
  function hideAlert(id) { document.getElementById(id).classList.remove('show'); }

  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
  });

  document.getElementById('newSessionName').addEventListener('keydown', e => { if (e.key === 'Enter') createSession(); });
  document.getElementById('newPlayerName').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

  // ── Toast ─────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ── Escape helper ─────────────────────────────────────────────────────────
  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  tryReadOnly().then(isRO => { if (!isRO) renderSessions(); });
</script>
